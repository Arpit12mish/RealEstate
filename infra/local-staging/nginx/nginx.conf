user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format sfs_json escape=json
        '{"time":"$time_iso8601",'
        '"requestId":"$sfs_request_id",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"requestTime":$request_time,'
        '"upstreamResponseTime":"$upstream_response_time",'
        '"bytesSent":$bytes_sent}';

    access_log /dev/stdout sfs_json;
    error_log /dev/stderr warn;

    map $http_x_request_id $sfs_request_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    upstream sfs_backend {
        server backend:8080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 32m;

        location = /local-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://sfs_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $sfs_request_id;
            proxy_set_header X-Real-IP $remote_addr;
            # Deliberately overwrite client-supplied XFF. This topology has one
            # trusted proxy, so appending would retain a spoofable left edge.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
