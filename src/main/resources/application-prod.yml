spring:
  config:
    import: "optional:classpath:application-rate-limit.yml"
  # Standard Spring Boot / HikariCP-managed datasource. No safe default is
  # possible here (a real DB connection is required for the app to function
  # at all) - these three MUST be set via /etc/sfs-app.env in production.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      pool-name: ${SPRING_DATASOURCE_HIKARI_POOL_NAME:SfsHikariPool}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:2000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:0}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 25
        jdbc:
          batch_size: 25
        generate_statistics: false
      jakarta:
        persistence:
          query:
            timeout: ${SPRING_JPA_QUERY_TIMEOUT_MS:10000}
  # Mail is not actually used to send anything today (EmailService is dead/
  # commented-out code) and management.health.mail.enabled=false below
  # disables the only thing that would otherwise probe this at /actuator/
  # health. Safe to leave blank; only set these if EmailService is ever
  # revived.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

app:
  cms:
    media:
      # Must identify a private bucket, or a bucket whose cms/** prefix is denied public reads.
      bucket: ${CMS_MEDIA_S3_BUCKET:}
      max-image-bytes: ${CMS_MEDIA_MAX_IMAGE_BYTES:15728640}
      max-video-bytes: ${CMS_MEDIA_MAX_VIDEO_BYTES:262144000}
      validation-prefix-bytes: ${CMS_MEDIA_VALIDATION_PREFIX_BYTES:262144}
      pending-retention-hours: ${CMS_MEDIA_PENDING_RETENTION_HOURS:24}
      failed-retention-days: ${CMS_MEDIA_FAILED_RETENTION_DAYS:7}
      public-delivery:
        # Required in production. Must be the HTTPS CloudFront/custom media origin.
        base-url: ${CMS_MEDIA_PUBLIC_BASE_URL:}
      cleanup-batch-size: ${CMS_MEDIA_CLEANUP_BATCH_SIZE:100}
  review:
    enabled: ${APP_REVIEW_ENABLED:false}
    phone-number: ${APP_REVIEW_PHONE_NUMBER:}
    fixed-otp: ${APP_REVIEW_FIXED_OTP:}
    resend-after-seconds: ${APP_REVIEW_RESEND_AFTER_SECONDS:30}
  instagram:
    fallback-thumbnail-url: ${APP_INSTAGRAM_FALLBACK_THUMBNAIL_URL:https://sfs-s3bucket.s3.ap-south-1.amazonaws.com/banner/Hero/M3M-Jacob-%26-Co-1.webp}
    thumbnail-cache-ttl-hours: ${APP_INSTAGRAM_THUMBNAIL_CACHE_TTL_HOURS:24}
    asset-download-timeout-seconds: ${APP_INSTAGRAM_ASSET_DOWNLOAD_TIMEOUT_SECONDS:10}
    max-thumbnail-bytes: ${APP_INSTAGRAM_MAX_THUMBNAIL_BYTES:5242880}
  logging:
    path: /var/log/sfs/app
  media:
    s3:
      # bucket/region are not secrets (resource identifiers), so a real
      # non-secret default is used - override via env only if it changes.
      bucket: ${AWS_S3_BUCKET:sfs-s3bucket}
      region: ${AWS_S3_REGION:ap-south-1}
      publicBaseUrl: ${AWS_S3_PUBLIC_BASE_URL:}
      presignExpirySeconds: ${AWS_S3_PRESIGN_EXPIRY_SECONDS:300}
      maxPromoBannerVideoBytes: ${APP_MEDIA_MAX_PROMO_BANNER_VIDEO_BYTES:26214400}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  address: 0.0.0.0
  port: 8080
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:2048}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name:sfs}

# ============================================================
# Mobile/app JWT. No safe default - required for every mobile
# auth flow to function. Set via /etc/sfs-app.env.
# ============================================================
jwt:
  secret: ${JWT_SECRET}
  expiration:
    ms: ${JWT_EXPIRATION_MS}
  refresh:
    expiration:
      days: ${JWT_REFRESH_EXPIRATION_DAYS:15}

# ============================================================
# Dashboard JWT + seed. Seed defaults are intentionally the SAFE
# (disabled) state - see docs/PRODUCTION_ENV_TEMPLATE.md for why
# this differs from what may currently be running, and why that
# needs an explicit decision before rollout.
# ============================================================
dashboard:
  jwt:
    secret: ${DASHBOARD_JWT_SECRET}
    access-expiration-ms: ${DASHBOARD_JWT_ACCESS_EXPIRATION_MS}
  refresh:
    expiration-days: ${DASHBOARD_REFRESH_EXPIRATION_DAYS:15}
  seed:
    enabled: ${DASHBOARD_SEED_ENABLED:false}
    update-passwords: ${DASHBOARD_SEED_UPDATE_PASSWORDS:false}
    admin:
      email: ${DASHBOARD_SEED_ADMIN_EMAIL:}
      password: ${DASHBOARD_SEED_ADMIN_PASSWORD:}
      name: ${DASHBOARD_SEED_ADMIN_NAME:SFS Admin}
    reviewer:
      email: ${DASHBOARD_SEED_REVIEWER_EMAIL:}
      password: ${DASHBOARD_SEED_REVIEWER_PASSWORD:}
      name: ${DASHBOARD_SEED_REVIEWER_NAME:SFS Reviewer}
    data-entry:
      email: ${DASHBOARD_SEED_DATA_ENTRY_EMAIL:}
      password: ${DASHBOARD_SEED_DATA_ENTRY_PASSWORD:}
      name: ${DASHBOARD_SEED_DATA_ENTRY_NAME:SFS Data Entry}

# ============================================================
# Twilio Verify (OTP). No safe default: TwilioVerifyClientImpl initializes
# the SDK eagerly for the prod profile, so blank credentials fail startup
# immediately (fail-fast, not a silent runtime break).
# ============================================================
twilio:
  accountSid: ${TWILIO_ACCOUNT_SID}
  authToken: ${TWILIO_AUTH_TOKEN}
  verifyServiceSid: ${TWILIO_VERIFY_SERVICE_SID}
  phoneNumber: ${TWILIO_PHONE_NUMBER:}
  connect-timeout-ms: ${TWILIO_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${TWILIO_READ_TIMEOUT_MS:8000}

# ============================================================
# Elasticsearch stays DISABLED. sfs.search.enabled=false already
# makes BusinessSearchServiceImpl/BusinessIndexInitializer skip all
# real ES calls, but ElasticsearchConfig unconditionally builds a
# RestClient/ElasticsearchClient bean at startup regardless of that
# flag (no @ConditionalOnProperty exists on it). HttpHost.create(url)
# only parses the URL - it does not connect - so a syntactically
# valid but inert localhost placeholder lets the bean construct
# safely without requiring a real Elastic Cloud endpoint/key while
# search stays off. See docs/PRODUCTION_ENV_TEMPLATE.md for the
# recommended follow-up (@ConditionalOnProperty on ElasticsearchConfig)
# if this should be tightened later - not done here to avoid touching
# the two business-logic classes that currently require the bean.
# ============================================================
elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  api-key: ${ELASTICSEARCH_API_KEY:}

# ============================================================
# Google Places (connectivity/nearby-place features).
# ============================================================
google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
    field-mask: id,displayName,formattedAddress,googleMapsUri,rating,userRatingCount,reviews
    search-text-url: ${GOOGLE_PLACES_TEXT_SEARCH_URL:https://places.googleapis.com/v1/places:searchText}
    connect-timeout-ms: ${GOOGLE_PLACES_CONNECT_TIMEOUT_MS:${GOOGLE_PLACES_TIMEOUT_MS:3000}}
    read-timeout-ms: ${GOOGLE_PLACES_READ_TIMEOUT_MS:${GOOGLE_PLACES_TIMEOUT_MS:5000}}
    request-timeout-ms: ${GOOGLE_PLACES_REQUEST_TIMEOUT_MS:${GOOGLE_PLACES_TIMEOUT_MS:8000}}
  maps:
    places:
      enabled: ${GOOGLE_MAPS_PLACES_ENABLED:true}
      api-key: ${GOOGLE_PLACES_API_KEY:}
      text-search-url: ${GOOGLE_PLACES_TEXT_SEARCH_URL:https://places.googleapis.com/v1/places:searchText}
      default-language-code: en
      default-region-code: IN
      connect-timeout-ms: ${GOOGLE_PLACES_CONNECT_TIMEOUT_MS:${GOOGLE_PLACES_TIMEOUT_MS:3000}}
      read-timeout-ms: ${GOOGLE_PLACES_READ_TIMEOUT_MS:${GOOGLE_PLACES_TIMEOUT_MS:5000}}
      request-timeout-ms: ${GOOGLE_PLACES_REQUEST_TIMEOUT_MS:${GOOGLE_PLACES_TIMEOUT_MS:8000}}
      max-results: ${GOOGLE_PLACES_MAX_RESULTS:10}
      max-radius-meters: ${GOOGLE_PLACES_MAX_RADIUS_METERS:5000}

# ============================================================
# AWS credentials are resolved entirely by AwsS3Config's
# DefaultCredentialsProvider (env vars incl. AWS_SESSION_TOKEN,
# ~/.aws profiles, container credentials, EC2 IAM instance role).
# No app-specific property is bound here on purpose.
# ============================================================
# Meta/Instagram - LIVE feature, must keep working. sfs.search
# lives under the same top-level "sfs" key as sfs.instagram - do
# not split this into two separate top-level "sfs:" blocks, which
# would silently last-value-win clobber one of them under SnakeYAML.
# ============================================================
sfs:
  log:
    dir: ${SFS_LOG_DIR:/var/log/sfs/app}
  search:
    enabled: ${SFS_SEARCH_ENABLED:false}
  # Production-hardening pass: this contract used to exist only in the gitignored
  # base application.yml, which a clean production build does not have on the
  # classpath - every value below fell back silently to its Java-level default
  # (AnalyticsIngestionProperties), with no tracked, reviewable, or env-tunable
  # surface. None of these are secrets and every one has a safe default, so nothing
  # here was ever a startup-failure risk; the risk was invisibility and non-
  # tunability. See docs/PRODUCTION_ENV_TEMPLATE.md for the env var list.
  analytics:
    ingestion:
      enabled: ${SFS_ANALYTICS_ENABLED:true}
      queue-capacity: ${SFS_ANALYTICS_QUEUE_CAPACITY:10000}
      drain-batch-size: ${SFS_ANALYTICS_DRAIN_BATCH_SIZE:300}
      drain-interval-ms: ${SFS_ANALYTICS_DRAIN_INTERVAL_MS:2000}
      max-properties-json-length: ${SFS_ANALYTICS_MAX_PROPERTIES_JSON_LENGTH:2000}
      raw-retention-days: ${SFS_ANALYTICS_RAW_RETENTION_DAYS:120}
      partition-lookahead-months: ${SFS_ANALYTICS_PARTITION_LOOKAHEAD_MONTHS:3}
    aggregation:
      schedule: ${SFS_ANALYTICS_AGGREGATION_SCHEDULE:0 30 2 * * *}
    partition-maintenance:
      schedule: ${SFS_ANALYTICS_PARTITION_MAINTENANCE_SCHEDULE:0 0 3 * * *}
  logging:
    request:
      async:
        queue-size: ${SFS_REQUEST_LOG_ASYNC_QUEUE_SIZE:2048}
        discarding-threshold: ${SFS_REQUEST_LOG_ASYNC_DISCARDING_THRESHOLD:0}
        never-block: ${SFS_REQUEST_LOG_ASYNC_NEVER_BLOCK:true}
        include-caller-data: ${SFS_REQUEST_LOG_ASYNC_INCLUDE_CALLER_DATA:false}
        max-flush-time-ms: ${SFS_REQUEST_LOG_ASYNC_MAX_FLUSH_TIME_MS:5000}
  authentication:
    identity-cache:
      mobile:
        enabled: ${SFS_AUTH_IDENTITY_CACHE_MOBILE_ENABLED:true}
        maximum-size: ${SFS_AUTH_IDENTITY_CACHE_MOBILE_MAXIMUM_SIZE:50000}
        expire-after-write: ${SFS_AUTH_IDENTITY_CACHE_MOBILE_EXPIRE_AFTER_WRITE:30s}
      dashboard:
        enabled: ${SFS_AUTH_IDENTITY_CACHE_DASHBOARD_ENABLED:true}
        maximum-size: ${SFS_AUTH_IDENTITY_CACHE_DASHBOARD_MAXIMUM_SIZE:5000}
        expire-after-write: ${SFS_AUTH_IDENTITY_CACHE_DASHBOARD_EXPIRE_AFTER_WRITE:15s}
  refresh-token:
    cleanup:
      enabled: ${SFS_REFRESH_TOKEN_CLEANUP_ENABLED:true}
      schedule: ${SFS_REFRESH_TOKEN_CLEANUP_SCHEDULE:0 0 2 * * *}
      batch-size: ${SFS_REFRESH_TOKEN_CLEANUP_BATCH_SIZE:1000}
      maximum-batches-per-run: ${SFS_REFRESH_TOKEN_CLEANUP_MAXIMUM_BATCHES_PER_RUN:20}
      maximum-execution-duration: ${SFS_REFRESH_TOKEN_CLEANUP_MAXIMUM_EXECUTION_DURATION:30s}
  # OTP send/verify abuse limits for TwilioOtpServiceImpl (shared by /request-otp and
  # /otp/resend - see RateLimitPolicyResolver for why both routes share one policy too).
  # expires-in-seconds is informational only: Twilio Verify's code TTL is a fixed ~10
  # minutes and is not configurable via the Verify API, so this only drives the
  # frontend countdown display and must be updated by hand if that default changes.
  otp:
    resend-cooldown-seconds: ${SFS_OTP_RESEND_COOLDOWN_SECONDS:30}
    max-sends-per-window: ${SFS_OTP_MAX_SENDS_PER_WINDOW:5}
    send-window-minutes: ${SFS_OTP_SEND_WINDOW_MINUTES:15}
    max-verify-failures-per-window: ${SFS_OTP_MAX_VERIFY_FAILURES_PER_WINDOW:5}
    verify-window-minutes: ${SFS_OTP_VERIFY_WINDOW_MINUTES:10}
    block-minutes: ${SFS_OTP_BLOCK_MINUTES:15}
    expires-in-seconds: ${SFS_OTP_EXPIRES_IN_SECONDS:600}
  instagram:
    meta:
      graph-api-version: ${META_GRAPH_API_VERSION:v25.0}
      app-id: ${META_APP_ID:}
      app-secret: ${META_APP_SECRET:}
      access-token: ${META_ACCESS_TOKEN:}
      facebook-page-id: ${META_FACEBOOK_PAGE_ID:}
      instagram-business-account-id: ${META_INSTAGRAM_BUSINESS_ACCOUNT_ID:}
      sync-enabled: ${META_INSTAGRAM_SYNC_ENABLED:false}
      sync-cron: ${META_INSTAGRAM_SYNC_CRON:0 0 * * * *}
      public-limit: ${META_INSTAGRAM_PUBLIC_LIMIT:10}
      request-timeout-seconds: ${META_INSTAGRAM_REQUEST_TIMEOUT_SECONDS:15}

# Production-safe logging levels. This is the one place production logging
# level is explicitly, self-containedly defined - it must not depend on
# inheriting a safe default from application.yml (which is loaded for every
# profile and previously leaked root: DEBUG into prod - see the comment
# there). logback-spring.xml's "!local" springProfile block backs these same
# guards up at the appender-wiring layer.
logging:
  level:
    root: INFO

    # SFS application logs
    "[com.brandPitara.sfs]": INFO
    "[com.brandPitara.sfs.observability.api]": INFO
    "[com.brandPitara.sfs.observability.api.reliable]": WARN
    "[com.brandPitara.sfs.observability.security]": INFO
    "[com.brandPitara.sfs.observability.audit]": INFO
    "[com.brandPitara.sfs.ratelimit]": INFO

    # Spring noise control
    "[org.springframework]": WARN
    "[org.springframework.web]": WARN
    "[org.springframework.security]": WARN
    "[org.springframework.boot.autoconfigure]": WARN
    "[org.springframework.beans.factory]": WARN
    "[org.springframework.orm.jpa]": WARN

    # Hibernate SQL/bind/entity-dump suppression.
    # Verified against the actual hibernate-core:7.1.8.Final jar on the
    # classpath: BasicBinder now lives under type.descriptor.jdbc (not the
    # legacy .sql package some older docs/configs reference), and it has no
    # logger of its own - bind-parameter value logging is entirely gated by
    # the org.hibernate.orm.jdbc.bind category (JdbcBindingLogging), which is
    # TRACE-gated in Hibernate's own source, so OFF (not just WARN) is the
    # only setting that reliably guarantees it can never print a value.
    #
    # IMPORTANT: "OFF" MUST be quoted below. YAML 1.1 (which SnakeYAML/Spring's
    # YAML parser follows) treats a bare on/off/yes/no (any case) as a boolean
    # literal, not a string - an unquoted OFF here is parsed as the boolean
    # `false`, which Spring's logging system does not accept as a level name.
    # This was caught by ProductionLoggingConfigTest during this hardening
    # work; if you ever add another OFF-level logger, quote it the same way.
    "[org.hibernate]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.orm.jdbc.bind]": "OFF"
    "[org.hibernate.type.descriptor.jdbc.BasicBinder]": "OFF"
    "[org.hibernate.type.descriptor.sql.BasicBinder]": "OFF"
    "[org.hibernate.internal.util.EntityPrinter]": "OFF"

    # DB pool
    "[com.zaxxer.hikari]": INFO

    # JDK/HTTP debug leakage guards. GooglePlacesClient/GoogleNearbyPlaceProvider
    # send X-Goog-Api-Key via raw java.net.http.HttpClient - these loggers are
    # exactly where the JDK HttpClient would print full request headers
    # (including that key) if DEBUG/FINE-level logging were ever enabled here.
    "[sun.net]": WARN
    "[sun.net.www.protocol.http]": WARN
    "[sun.net.www.protocol.https]": WARN
    "[jdk.internal.httpclient]": WARN
    "[jdk.internal.net.http]": WARN
    "[jdk.event.security]": WARN
