          - keyType: IP
            capacity: 120
            refillTokens: 120
            refillPeriodSeconds: 60

      # Phase 4: final remaining mobile/public read route policies.
      # Note: GET /api/public/cities/trending reuses PUBLIC_CITY_READ above - no
      # duplicate config entry needed for it.
      PUBLIC_BRAND_READ:
        limits:
          - keyType: IP
            capacity: 120
            refillTokens: 120
            refillPeriodSeconds: 60
      PUBLIC_DISTRIBUTOR_READ:
        limits:
          - keyType: IP
            capacity: 120
            refillTokens: 120
            refillPeriodSeconds: 60
      PUBLIC_CATEGORY_READ:
        limits:
          - keyType: IP
            capacity: 120
            refillTokens: 120
            refillPeriodSeconds: 60
      PUBLIC_CONTENT_VERSION_READ:
        limits:
          - keyType: IP
            capacity: 600
            refillTokens: 600
            refillPeriodSeconds: 60
      MOBILE_SESSION_READ:
        limits:
          - keyType: IP_OR_USER
            capacity: 300
            refillTokens: 300
            refillPeriodSeconds: 60
